<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS Weather Dashboard - Iron Man HUD</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body class="jarvis-theme">
    <div class="stars-background"></div>
    <div class="grid-background"></div>
    
    <!-- Main Container -->
    <div class="hud-container">
        <!-- Header/Title -->
        <header class="hud-header">
            <div class="arc-reactor">
                <div class="arc-core"></div>
                <div class="arc-ring arc-ring-1"></div>
                <div class="arc-ring arc-ring-2"></div>
                <div class="arc-ring arc-ring-3"></div>
            </div>
            <h1 class="jarvis-title">J.A.R.V.I.S.</h1>
            <span class="subtitle">Weather Intelligence System</span>
        </header>

        <!-- Main Content Grid -->
        <div class="hud-content">
            <!-- Left Panel -->
            <div class="hud-panel left-panel">
                <div class="panel-header">
                    <h2>📍 Місцезнаходження</h2>
                </div>
                <div class="city-search">
                    <input type="text" id="cityInput" placeholder="Введіть назву міста..." class="neon-input">
                    <button id="searchBtn" class="neon-button">🔍 Пошук</button>
                </div>
                <div class="city-list">
                    <div class="city-item" data-city="Kyiv">🇺🇦 Київ</div>
                    <div class="city-item" data-city="Lviv">🏰 Львів</div>
                    <div class="city-item" data-city="Kharkiv">⚡ Харків</div>
                    <div class="city-item" data-city="Odesa">⛱️ Одеса</div>
                </div>
            </div>

            <!-- Center Panel - Main Display -->
            <div class="hud-panel center-panel">
                <!-- Weather Display -->
                <div class="weather-display" id="weatherDisplay">
                    <div class="loading-indicator">
                        <div class="pulse"></div>
                        <p>Синхронізація з системою...</p>
                    </div>
                </div>

                <!-- 3D Globe (Canvas) -->
                <canvas id="globeCanvas" class="globe-canvas"></canvas>
            </div>

            <!-- Right Panel -->
            <div class="hud-panel right-panel">
                <div class="panel-header">
                    <h2>⚙️ Налаштування</h2>
                </div>
                
                <!-- Temperature Unit Toggle -->
                <div class="setting-group">
                    <label>Одиниці температури:</label>
                    <div class="toggle-group">
                        <button class="toggle-btn active" data-unit="metric">°C</button>
                        <button class="toggle-btn" data-unit="imperial">°F</button>
                        <button class="toggle-btn" data-unit="standard">K</button>
                    </div>
                </div>

                <!-- Voice Control -->
                <div class="setting-group">
                    <label>🎤 Голосові команди:</label>
                    <button id="voiceBtn" class="neon-button-lg">🎙️ Активувати</button>
                    <p id="voiceStatus" class="voice-status">Готово до команд</p>
                </div>

                <!-- Theme Toggle -->
                <div class="setting-group">
                    <label>🌙 Тема:</label>
                    <button id="themeBtn" class="neon-button-lg">Темна режим</button>
                </div>

                <!-- Sound Toggle -->
                <div class="setting-group">
                    <label>🔊 Звук JARVIS:</label>
                    <button id="soundBtn" class="neon-button-lg">Увімкнено</button>
                </div>
            </div>
        </div>

        <!-- Bottom Status Bar -->
        <footer class="hud-footer">
            <div class="status-item">
                <span class="status-label">СТАТУС:</span>
                <span id="statusText" class="status-value">🟢 ОНЛАЙН</span>
            </div>
            <div class="status-item">
                <span class="status-label">ОСТАННЄ ОНОВЛЕННЯ:</span>
                <span id="lastUpdate" class="status-value">--:--:--</span>
            </div>
            <div class="status-item">
                <span class="status-label">ВЕРСІЯ:</span>
                <span class="status-value">2.0.1</span>
            </div>
        </footer>
    </div>

    <!-- Audio Player (Hidden) -->
    <audio id="jarvisAudio" style="display: none;"></audio>
    <audio id="notificationSound" preload="auto">
        <source src="sounds/notification.mp3" type="audio/mpeg">
    </audio>

    <!-- Scripts -->
    <script src="js/particles.js"></script>
    <script src="js/globe.js"></script>
    <script src="js/voice-commands.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
